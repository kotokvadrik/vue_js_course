<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab3 2</title>

    <style>
        * {
            user-select: none;
        }

        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        .menu {
            position: fixed;
            top: 0;
            width: 100%;
            background: #333;
            color: white;
            padding: 15px;
            display: flex;
            gap: 30px;
        }

        .main-content {
            margin-top: 70px;
            padding: 20px;
        }

        .letter-red { color: red; }
        .letter-blue { color: blue; }

        .old {
            text-decoration: line-through;
            color: gray;
        }

        .new {
            font-weight: bold;
            color: black;
        }
        .theorem-font {
            font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', 'cursive', monospace !important;
            font-size: 16px;
        }

        .theorem-font,
        .theorem-font * {
            font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', 'cursive', monospace !important;
        }


        .table {
            border-collapse: collapse;
            margin-top: 10px;
            background: #00cadc;
        }

        .table td {
            border: 2px solid teal;
            padding: 8px;
        }

        .device {
            text-align: center;
            font-size: 24px;
            margin: 20px;
        }

        @media (min-width:1024px) {
            .device::after { content: "Desktop"; }
        }
        @media (max-width:1023px) and (min-width:768px) {
            .device::after { content: "Tablet"; }
        }
        @media (max-width:767px) {
            .device::after { content: "Mobile"; }
        }

        .circle {
            width: 60px;
            height: 60px;
            background: blue;
            border-radius: 60%;
            position: fixed;
            pointer-events: none;
        }


        .layout {
            width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .logo {
            font-size: 26px;
            margin: 20px 0;
        }

        .nav {
            background: #ddd;
            padding: 10px;
        }

        .nav a {
            margin: 0 10px;
            text-decoration: none;
            color: purple;
        }

        .block {
            background: #ddd;
            padding: 40px;
            margin-top: 15px;
        }

        .columns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .col {
            flex: 1;
            background: #ddd;
            padding: 40px 0;
        }

        .doublecol {
            flex: 0.5;
            background: #ddd;
            padding: 40px 0;
        }

        .footer {
            background: #ddd;
            padding: 10px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="menu">
    <div>Главная</div>
    <div>Каталог</div>
    <div>Контакты</div>
    <div>О нас</div>
</div>

<div class="main-content">
    <h2>Добро пожаловать!</h2>

    <p>
        <em>
            <span class="letter-red">П</span><span class="letter-blue">р</span><span class="letter-red">и</span><span class="letter-blue">в</span><span class="letter-red">е</span><span class="letter-blue">т</span><span class="letter-red">с</span><span class="letter-blue">т</span><span class="letter-red">в</span><span class="letter-blue">у</span><span class="letter-red">е</span><span class="letter-blue">м</span>
        </em>

        <u>
            <span class="letter-red">в</span><span class="letter-blue">а</span><span class="letter-red">с</span>
        </u>

        <strong>
            <span class="letter-blue">в</span>
        </strong>

        <span> </span>

        <strong>
            <span class="letter-red">н</span><span class="letter-blue">а</span><span class="letter-red">ш</span><span class="letter-blue">е</span><span class="letter-red">м</span>
        </strong>
        <a href="#">
            <span class="letter-blue">м</span><span class="letter-red">а</span><span class="letter-blue">г</span><span class="letter-red">а</span><span class="letter-blue">з</span><span class="letter-red">и</span><span class="letter-blue">н</span><span class="letter-red">е</span>
        </a>
    </p>

    <p class="theorem-font">
        &lt;h1&gt;Теорема Пифагора&lt;/h1&gt;:
        c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup>
    </p>
    <table class="table">
        <tr>
            <td colspan="2"><strong>Информация</strong></td>
        </tr>
        <tr>
            <td>Старая цена: <span class="old">1000 ₽</span></td>
            <td>Новая цена: <span class="new">500 ₽</span></td>
        </tr>
    </table>

    <div class="device"></div>

    <div class="layout">

        <div class="logo">Логотип</div>

        <div class="nav">
            <a href="#">Домой</a>
            <a href="#">Товары</a>
            <a href="#">Услуги</a>
            <a href="#">О нас</a>
            <a href="#">Контакты</a>
        </div>

        <div class="block">Характеристика</div>

        <div class="columns">
            <div class="col">Колонка 1</div>
            <div class="col">Колонка 2</div>
            <div class="col">Колонка 3</div>
        </div>

        <div class="footer">© МЕРНІ 2023</div>

    </div>

</div>

<div class="circle" id="circle"></div>
<script src="lab3 2.js"></script>
</body>
</html>
